<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapishi Yetu | Premium Kenyan Food Delivery</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0F766E;
            --primary-light: #14B8A6;
            --secondary: #EA580C;
            --bg: #F8FAFC;
            --surface: #FFFFFF;
            --text-dark: #0F172A;
            --text-muted: #64748B;
            --radius-md: 16px;
            --radius-lg: 24px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text-dark); line-height: 1.5; }
        header { background: var(--surface); padding: 20px 15px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-sm); }
        header h1 { font-size: 28px; font-weight: 800; color: var(--primary); margin-bottom: 4px; }
        header p { font-size: 14px; color: var(--text-muted); }
        .search-container { padding: 20px 15px; background: var(--surface); position: sticky; top: 85px; z-index: 99; box-shadow: 0 4px 6px -6px rgba(0,0,0,0.1); display: flex; justify-content: center; }
        .search-wrapper { position: relative; width: 100%; max-width: 800px; display: flex; gap: 10px; }
        .search-icon { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .search-container input { flex: 1; padding: 16px 16px 16px 48px; border: 2px solid #E2E8F0; border-radius: 50px; font-size: 16px; font-family: inherit; outline: none; background: var(--bg); }
        .search-container input:focus { border-color: var(--primary-light); background: var(--surface); }
        .search-container button { background: var(--primary); color: white; border: none; padding: 0 32px; border-radius: 50px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .search-container button:hover { background: var(--primary-light); }
        #status-msg { text-align: center; padding: 40px 20px; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .spinner { border: 4px solid #E2E8F0; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px; padding: 24px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--surface); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-md); cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); }
        .card-img-wrapper { width: 100%; height: 160px; overflow: hidden; background: #E2E8F0; }
        .card img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .card:hover img { transform: scale(1.05); }
        .card-content { padding: 16px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-meta { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .card-price { color: var(--secondary); font-weight: 800; font-size: 18px; }
        .card-area { font-size: 13px; color: var(--text-muted); background: var(--bg); padding: 4px 10px; border-radius: 20px; font-weight: 500; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; opacity: 0; transition: 0.3s; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content { background: var(--surface); border-radius: var(--radius-lg); width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; position: relative; transform: translateY(20px); transition: 0.3s; }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .close-btn { position: absolute; top: 16px; right: 16px; background: rgba(15, 23, 42, 0.6); color: white; border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 20px; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; }
        .modal-img { width: 100%; height: 250px; object-fit: cover; }
        .modal-body { padding: 24px; }
        .modal-header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; margin-bottom: 16px; }
        .modal-title { font-size: 24px; font-weight: 800; line-height: 1.2; }
        .modal-price { color: var(--secondary); font-size: 22px; font-weight: 800; white-space: nowrap; }
        .modal-section-title { font-size: 13px; font-weight: 700; margin: 24px 0 12px; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }
        .modal-list { list-style: none; padding: 0; font-size: 15px; color: var(--text-muted); }
        .modal-list li { padding: 8px 0; border-bottom: 1px solid #F1F5F9; }
        .modal-instructions { font-size: 15px; line-height: 1.7; color: var(--text-muted); white-space: pre-line; }
        .order-btn { display: flex; justify-content: center; align-items: center; gap: 10px; width: 100%; background: var(--primary); color: white; padding: 18px; border: none; border-radius: var(--radius-md); font-size: 18px; font-weight: 700; margin-top: 30px; cursor: pointer; transition: 0.2s; }
        .order-btn:hover { background: var(--primary-light); }
    </style>
</head>
<body>
    <header>
        <h1>Mapishi Yetu</h1>
        <p>Authentic Kenyan Flavors, Delivered</p>
    </header>
    <div class="search-container">
        <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="searchInput" placeholder="Search meals (e.g., Chicken, Beef)" value="Chicken">
            <button onclick="performSearch()">Search</button>
        </div>
    </div>
    <div id="status-msg">
        <div class="spinner"></div>
        Loading delicious meals...
    </div>
    <div class="grid" id="mealGrid"></div>

    <div class="modal-overlay" id="mealModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            <img id="modalImg" class="modal-img" src="" alt="Meal">
            <div class="modal-body">
                <div class="modal-header-row">
                    <h2 id="modalTitle" class="modal-title"></h2>
                    <div id="modalPrice" class="modal-price"></div>
                </div>
                <div class="modal-section-title">Ingredients</div>
                <ul id="modalIngredients" class="modal-list"></ul>
                <div class="modal-section-title">Instructions</div>
                <p id="modalInstructions" class="modal-instructions"></p>
                <button class="order-btn" onclick="orderMeal()">
                    <i class="fa-solid fa-bag-shopping"></i> Order Now
                </button>
            </div>
        </div>
    </div>

    <script>
        // 🛠️ LOCAL DATABASE: Bypasses CORS and loads instantly!
        const mealDatabase = [
            { idMeal: "52772", strMeal: "Teriyaki Chicken Casserole", strArea: "Japanese", strMealThumb: "https://www.themealdb.com/images/media/meals/wvpsxx1468256321.jpg", strInstructions: "Preheat oven to 350° F. Spray a 9x13-inch baking pan with non-stick spray. Combine soy sauce, ½ cup water, brown sugar, ginger and garlic in a small saucepan and cover. Bring to a boil over medium heat. Remove lid and cook for one minute once boiling. Meanwhile, stir together the corn starch and 2 tablespoons of water in a separate dish until smooth. Once sauce is boiling, add mixture to the saucepan and stir to combine. Cook until the sauce starts to thicken then remove from heat. Place the chicken breasts in the prepared pan. Pour one cup of the sauce over top of chicken. Place chicken in oven and bake 35 minutes or until cooked through, basting occasionally with the sauce in the pan. Meanwhile, in a large skillet, combine the broccoli, carrots and ⅓ cup water. Bring to a boil, then reduce to a simmer. Cover and cook 5-7 minutes or until tender-crisp. Drain any remaining water. Remove chicken from oven and let rest for 5 minutes before slicing. Serve over rice with extra sauce.", strIngredient1: "Soy Sauce", strMeasure1: "3/4 cup", strIngredient2: "Water", strMeasure2: "1/2 cup", strIngredient3: "Brown Sugar", strMeasure3: "1/4 cup", strIngredient4: "Ground Ginger", strMeasure4: "1/2 teaspoon", strIngredient5: "Minced Garlic", strMeasure5: "1/2 teaspoon", strIngredient6: "Cornstarch", strMeasure6: "4 Tablespoons", strIngredient7: "Chicken Breasts", strMeasure7: "2", strIngredient8: "Broccoli", strMeasure8: "1 head", strIngredient9: "Carrots", strMeasure9: "1 cup" },
            { idMeal: "52771", strMeal: "Spicy Arrabiata Penne", strArea: "Italian", strMealThumb: "https://www.themealdb.com/images/media/meals/ustsqw1468250014.jpg", strInstructions: "Bring a large pot of water to a boil. Add penne and cook according to package directions. Meanwhile, heat oil in a large skillet over medium heat. Add garlic and cook until fragrant. Add tomatoes and red pepper flakes. Simmer for 10 minutes. Drain pasta and add to sauce. Toss with parsley and parmesan cheese.", strIngredient1: "Penne Rigate", strMeasure1: "1 pound", strIngredient2: "Olive Oil", strMeasure2: "2 tbs", strIngredient3: "Garlic", strMeasure3: "3 cloves", strIngredient4: "Chopped Tomatoes", strMeasure4: "1 can", strIngredient5: "Red Chilli Flakes", strMeasure5: "1 tsp", strIngredient6: "Parsley", strMeasure6: "Handful", strIngredient7: "Parmesan Cheese", strMeasure7: "To serve" },
            { idMeal: "52785", strMeal: "Dal Fry", strArea: "Indian", strMealThumb: "https://www.themealdb.com/images/media/meals/wuxrtu1483564410.jpg", strInstructions: "Wash and soak lentils for 30 mins. Boil with turmeric and salt until soft. In a pan heat ghee, add cumin seeds, ginger, garlic, onions and fry till golden. Add tomatoes and spices, cook till oil separates. Add the boiled dal and simmer for 10 minutes. Garnish with coriander.", strIngredient1: "Toor Dal", strMeasure1: "1 cup", strIngredient2: "Turmeric", strMeasure2: "1/2 tsp", strIngredient3: "Ghee", strMeasure3: "2 tbs", strIngredient4: "Cumin Seeds", strMeasure4: "1 tsp", strIngredient5: "Ginger", strMeasure5: "1 inch", strIngredient6: "Garlic", strMeasure6: "4 cloves", strIngredient7: "Onion", strMeasure7: "1 chopped", strIngredient8: "Tomato", strMeasure8: "2 chopped" },
            { idMeal: "52765", strMeal: "Chicken Enchilada Casserole", strArea: "Mexican", strMealThumb: "https://www.themealdb.com/images/media/meals/qtuwxu1468232064.jpg", strInstructions: "Preheat oven to 350°F. In a large bowl, mix chicken, salsa, sour cream, and half the cheese. Layer tortillas, chicken mixture, and cheese in a baking dish. Bake for 30 minutes until bubbly.", strIngredient1: "Chicken", strMeasure1: "3 cups shredded", strIngredient2: "Salsa", strMeasure2: "2 cups", strIngredient3: "Sour Cream", strMeasure3: "1 cup", strIngredient4: "Cheese", strMeasure4: "3 cups", strIngredient5: "Tortillas", strMeasure5: "12" },
            { idMeal: "52764", strMeal: "Garlic Butter Shrimp", strArea: "American", strMealThumb: "https://www.themealdb.com/images/media/meals/1529444830.jpg", strInstructions: "Melt butter in a large skillet over medium heat. Add garlic and cook for 1 minute. Add shrimp and cook until pink, about 3-4 minutes per side. Stir in lemon juice and parsley. Serve hot.", strIngredient1: "Shrimp", strMeasure1: "1 lb", strIngredient2: "Butter", strMeasure2: "1/2 cup", strIngredient3: "Garlic", strMeasure3: "4 cloves minced", strIngredient4: "Lemon Juice", strMeasure4: "1 tbs", strIngredient5: "Parsley", strMeasure5: "Garnish" },
            { idMeal: "52763", strMeal: "Beef and Oyster Pie", strArea: "British", strMealThumb: "https://www.themealdb.com/images/media/meals/wrssvt1511556563.jpg", strInstructions: "Preheat oven to 200C. Brown the beef in a pan. Add onions and cook until soft. Stir in flour, then add stock and oysters. Simmer for 1 hour. Transfer to a pie dish, top with pastry, and bake for 30 minutes.", strIngredient1: "Beef", strMeasure1: "900g diced", strIngredient2: "Oysters", strMeasure2: "12", strIngredient3: "Onion", strMeasure3: "2", strIngredient4: "Beef Stock", strMeasure4: "500ml", strIngredient5: "Puff Pastry", strMeasure5: "500g" }
        ];

        const mealGrid = document.getElementById('mealGrid');
        const statusMsg = document.getElementById('status-msg');
        const modalOverlay = document.getElementById('mealModal');
        let currentMeal = null;

        function calculatePrice(id) { return (parseInt(id) * 15) + 150; }
        function formatKsh(amount) { return "KSh " + amount.toLocaleString(); }

        function performSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            statusMsg.style.display = 'flex';
            statusMsg.innerHTML = '<div class="spinner"></div> Searching for ' + query + '...';
            mealGrid.innerHTML = ''; 

            setTimeout(() => {
                const results = mealDatabase.filter(meal => 
                    meal.strMeal.toLowerCase().includes(query) || 
                    meal.strArea.toLowerCase().includes(query)
                );

                if (results.length === 0) {
                    statusMsg.innerHTML = "No meals found. Try searching for 'Chicken' or 'Beef'.";
                    return;
                }
                statusMsg.style.display = 'none';
                renderMeals(results);
            }, 500);
        }

        function renderMeals(meals) {
            meals.forEach(meal => {
                const price = calculatePrice(meal.idMeal);
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openModal(meal);
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${meal.strMealThumb}" alt="${meal.strMeal}" loading="lazy">
                    </div>
                    <div class="card-content">
                        <p class="card-title">${meal.strMeal}</p>
                        <div class="card-meta">
                            <p class="card-price">${formatKsh(price)}</p>
                            <p class="card-area">${meal.strArea}</p>
                        </div>
                    </div>
                `;
                mealGrid.appendChild(card);
            });
        }

        function getIngredients(meal) {
            let ingredients = [];
            for (let i = 1; i <= 20; i++) {
                const ing = meal[`strIngredient${i}`];
                const measure = meal[`strMeasure${i}`];
                if (ing && ing.trim() !== "") ingredients.push(`${measure} ${ing}`);
            }
            return ingredients;
        }

        function openModal(meal) {
            currentMeal = meal;
            const price = calculatePrice(meal.idMeal);
            document.getElementById('modalImg').src = meal.strMealThumb;
            document.getElementById('modalTitle').innerText = meal.strMeal;
            document.getElementById('modalPrice').innerText = formatKsh(price);
            
            const ingList = document.getElementById('modalIngredients');
            ingList.innerHTML = '';
            getIngredients(meal).forEach(ing => {
                const li = document.createElement('li');
                li.innerText = ing;
                ingList.appendChild(li);
            });
            document.getElementById('modalInstructions').innerText = meal.strInstructions;
            modalOverlay.classList.add('active');
        }

        function closeModal() { modalOverlay.classList.remove('active'); }

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        async function orderMeal() {
            if (!currentMeal) return;
            const price = calculatePrice(currentMeal.idMeal);
            let phone = prompt("Enter M-Pesa Phone Number (e.g., 254708374149):");
            if (!phone) return;
            if (!phone.startsWith("254")) {
                alert("Please start the phone number with 254 (e.g., 254708374149)");
                return;
            }

            const btn = document.querySelector('.order-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending Prompt...';
            btn.disabled = true;

            try {
                // ⚠️ PASTE YOUR ACTIVE NGROK URL HERE
                const BACKEND_URL = "https://pacific-itinerary-excess.ngrok-free.dev/api/stkpush"; 

                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
                    body: JSON.stringify({ phone: phone, amount: price })
                });

                const data = await response.json();
                if (response.ok) {
                    alert("📱 Success! Check your phone to enter your M-Pesa PIN.");
                    closeModal();
                } else {
                    console.error(data);
                    alert("Failed to initiate payment. Check your backend terminal for errors.");
                }
            } catch (error) {
                console.error(error);
                alert("Error connecting to payment server. Make sure your backend is running.");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        window.onload = () => { performSearch(); };
    </script>
</body>
</html>
